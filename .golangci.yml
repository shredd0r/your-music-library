version: "2"

linters:
  default: standard

  settings:
    errcheck:
      exclude-functions:
        # writing to the terminal
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    rules:
      # test setup steps fail loudly in the assertions that follow
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
